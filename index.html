<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <title>Œuvres de Stephen King</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
        }

        h1, .titre{
            text-align: center;
        }

        .titre {
            font-style: italic;
        }

        .active>* {
            color: rgb(205.5, 126, 123);
            text-decoration: line-through;
        }

        #totals span,
        .titre span {
            padding: 0 20px ;
        }
    </style>
</head>

<body class="container">
    <h1>Œuvres de Stephen King</h1>

    <div id="totals" style="text-align:center; margin-bottom:12px;">
        Total livres : <strong id="total-count">0</strong> <span>-</span>  Possédés : <strong id="owned-count">0</strong>
    </div>

    <div style="text-align: right;">
        <button class="outline" id="filter-not-owned">Afficher non possédés</button>
    </div>
    <div id="content"></div>
    <script>
        // Fonction pour afficher les œuvres
        function afficherOeuvres(oeuvres) {

            for (const categorie in oeuvres) {
                let possede = oeuvres[categorie].filter(oeuvre => oeuvre.possede).length
                let nombreLivre = oeuvres[categorie].length
                let html = `<div class="category">
                    <hr>
                    <div class="titre">
                        <h2>${categorie.replace('_', ' ').toUpperCase()}</h2>
                        <h6>Total ${categorie} : <strong>${nombreLivre}</strong> <span>-</span> Possédés : <strong>${possede}</strong></h3>
                            
                    </div>
                    <hr>
                    <table class="striped" data-theme="dark">
                        <thead data-theme="dark">
                            <tr>
                                <th>Titre Français</th>
                                <th>Titre Original</th>
                                <th>Année</th>
                                <th>Possédé</th>
                            </tr>
                        </thead>
                        <tbody>`;



                oeuvres[categorie].forEach(oeuvre => {

                    let classe = (oeuvre.possede) ? "active" : '';
                    html += `<tr class="${classe}">
                                <td>${oeuvre.titre_fr}</td>
                                <td>${oeuvre.titre_original}</td>
                                <td>${oeuvre.annee}</td>
                                <td><input
                                    data-id="${oeuvre.id}" 
                                    type="checkbox" ${oeuvre.possede ? 'checked' : ''}></td>
                            </tr>`;


                });

                html += `</tbody></table></div>`;
                document.getElementById('content').insertAdjacentHTML('beforeend', html);
            }
        }

        // Charger les données depuis le fichier JSON
        let rep = fetch('data/stephen_king_oeuvres.json')
            .then(response => response.json())
            .then(oeuvres => {
                window._oeuvresData = oeuvres;
                afficherOeuvres(oeuvres);
                updateTotalsFromData(oeuvres);
            })
            .catch(error => console.error('Erreur lors du chargement du fichier JSON:', error));

        // Mettre à jour les compteurs à partir des données
        function updateTotalsFromData(oeuvres) {
            let total = 0;
            let owned = 0;
            for (const cat in oeuvres) {
                total += oeuvres[cat].length;
                owned += oeuvres[cat].filter(o => Boolean(o.possede)).length;
            }
            document.getElementById('total-count').textContent = total;
            document.getElementById('owned-count').textContent = owned;
        }

        // Filtre pour n'afficher que les œuvres non possédées
        const filterBtn = document.getElementById('filter-not-owned');
        let filterActive = false;

        function applyFilter() {
            const checkboxes = document.querySelectorAll('table tbody input[type="checkbox"]');
            checkboxes.forEach(cb => {
                const tr = cb.closest('tr');
                if (!tr) return;
                if (filterActive) {
                    tr.style.display = cb.checked ? 'none' : '';
                } else {
                    tr.style.display = '';
                }
            });
        }

        filterBtn.addEventListener('click', () => {
            filterActive = !filterActive;
            filterBtn.textContent = filterActive ? 'Afficher tout' : 'Afficher non possédés';
            applyFilter();
        });

    </script>
</body>

</html>
